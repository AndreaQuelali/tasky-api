name: tasky

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasky}
      POSTGRES_DB: ${POSTGRES_DB:-tasky}
    ports:
      - "5432:5432"
    volumes:
      - tasky-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-tasky};Username=${POSTGRES_USER:-tasky};Password=${POSTGRES_PASSWORD:-tasky}
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "5080:8080"

volumes:
  tasky-db:
